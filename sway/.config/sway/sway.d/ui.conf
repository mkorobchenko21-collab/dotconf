### Output configuration

# Default wallpaper (more resolutions are available in /usr/share/backgrounds/sway/)
# This is commented in Debian, because the Sway wallpaper files are in a separate
# package `sway-backgrounds`. Installing this package drops a config file to
# /etc/sway/config.d/

output * bg /home/maximus/Pictures/wallpapers/debianlogoASCII.png fill

# gaps
gaps inner 2
gaps outer 2
smart_gaps off

# class           border   backgr.  text     indicator  child_border
client.focused    #000000  #3b3b3b  #ffffff  #242424    #000000
client.unfocused  #0d0d0d  #0d0d0d  #969696  #0d0d0d    #0d0d0d

# Floating windows
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="dialog"] floating enable
for_window [window_type="dialog"] floating enable

for_window [title="."] title_format "%title (%app_id)"
