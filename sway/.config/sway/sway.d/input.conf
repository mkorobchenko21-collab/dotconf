### Input configuration
#
# Example configuration:modprobe

#   input "2:14:SynPS/2_Synaptics_TouchPad" {
#  dwt enabled
#  tap enabled
#  natural_scroll enabled
#  middle_emulation enabled
#   }
#
# You can get the names of your inputs by running: swaymsg -t get_inputs
# Read `man 5 sway-input` for more information about this section.

input type:touchpad {
    dwt disabled
        dwtp disabled
        natural_scroll enabled
        middle_emulation enabled
        tap enabled
}

bindgesture hold:4 exec playerctl play-pause

bindgesture swipe:3:left workspace next
bindgesture swipe:3:right workspace prev
bindgesture swipe:3:up exec pactl set-sink-mute @DEFAULT_SINK@ 0
bindgesture swipe:3:down exec pactl set-sink-mute @DEFAULT_SINK@ 1

bindgesture swipe:4:up exec pactl set-sink-volume @DEFAULT_SINK@ +20%
bindgesture swipe:4:down exec pactl set-sink-volume @DEFAULT_SINK@ -20%
bindgesture swipe:4:right exec playerctl previous
bindgesture swipe:4:left exec playerctl next

bindgesture pinch:3:inward exec swaylock

input type:pointer accel_profile flat

input type:keyboard {
    xkb_layout us,ru,ua
        xkb_options grp:alt_space_toggle
}

# layout configuration
bindsym --locked Shift+Alt+1 exec swaymsg input type:keyboard xkb_switch_layout 0
bindsym --locked Shift+Alt+2 exec swaymsg input type:keyboard xkb_switch_layout 1
bindsym --locked Shift+Alt+3 exec swaymsg input type:keyboard xkb_switch_layout 2
