# Example configuration:
#
#   output HDMI-A-1 resolution 1920x1080 position 1920,0
#
# You can get the names of your outputs by running: swaymsg -t get_outputs

#
# monitors
#
output eDP-1 {
    mode 1920x1080@60Hz
        scale 1
        position 0 0
}

output "LG Electronics LG ULTRAGEAR 405NTXR9U858" {
    mode 1920x1080@144Hz 
        scale 1
        position 1920 -200
}

output 'Lenovo Group Limited L197 Wide V3NG289' {
    mode 1440x900@60Hz
        scale 1
# position 480 -900
}


# set $mon_main "LG Electronics LG ULTRAGEAR 405NTXR9U858"
# set $mon_second 'Lenovo Group Limited L197 Wide V3NG289'

set $mon_main     HDMI-A-1
set $mon_external HDMI-A-1

set $mon_second eDP-1

# set $mon_third 'Lenovo Group Limited L197 Wide V3NG289'
# set $mon_second eDP-1

workspace 1 output $mon_main
workspace 2 output $mon_main
workspace 3 output $mon_main
workspace 4 output $mon_main
workspace 5 output $mon_main

workspace 6 output $mon_second
workspace 7 output $mon_second
workspace 8 output $mon_second

workspace 9 output $mon_third
workspace 10 output $mon_third

bindsym $mod+m output $mon_external toggle
